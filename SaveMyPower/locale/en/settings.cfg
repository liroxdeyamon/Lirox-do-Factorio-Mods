[mod-setting-description]
default-blacklist-description=Better to leave it be, used for specific cases where such mechanic would be too unballanced, broken, or not needed at all. Added by mod authors or by user reports.
entity-blacklist-description=Entities excluded from energy retaining. Separate names with spaces, for example: "accumulator accumulator-mk2". Use debug option (all the way down) to get name in item description.
entity-blacklist-as-whitelist-description=Make entity blacklist act as whitelist.
equipment-blacklist-description=Equipment excluded from energy retaining. Separate names with spaces, for example: "personal-battery personal-energy-shield". Use debug option (all the way down) to get name in item description.
equipment-blacklist-as-whitelist-description=Make equipment blacklist act as whitelist.
minimum-energy-to-retain-description=Minimum charge in % required in entity or equipment to retain energy.
energy-stacking-description=Rounding for easy stacking. Range: 0–100. Examples: 0 = no rounding, 10 = 10%, 20%, 30%, etc., 20 = 20%, 40%, 60%, etc. Rounding goes down, so with 10: 55% = 50%, 99% = 90%, 8% = 0%, etc.
description-show-bar-description=Includes visual charge bar in item's description
description-bar-filled-color-description=Color of filled charge bar.
description-bar-empty-color-description=Color of empty charge bar.
description-bar-decorator-color-description=Color of bar decorator.
description-bar-length-description=Length of the charge bar's middle part.
description-show-percentage-description=Includes numerical charge percentage in item's description.
description-percentage-color-description=Color of the charge percentage text.
description-string-description=String used to display charge bar. Examples: "<+>" = "<++++++++++>", "*" = "***********", "+=" = "+=+=+=+=+=+=", "[$%&]" = "[$%&$%&$%&$]"
research-required-description=Enables "Advanced Power Conservation" technology that must be researched to enable energy conservation features.
retain-on-player-mined-description=Ability to retain energy when player/space platform mines entity.
retain-on-robot-mined-description=Ability to retain energy when robot mines entity.
retain-equipment-energy-description=Ability to retain energy when player removes equipment.
debug-description=More logs and item info in its description.

[technology-name]
advanced_power_conservation=Advanced power conservation

[shortcut-name]
SaveMyPower_enable=Toggle power conservation

[shortcut-description]
SaveMyPower_enable=Enable or disable automatic energy conservation.