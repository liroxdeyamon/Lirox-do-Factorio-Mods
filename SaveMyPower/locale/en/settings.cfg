[mod-setting-description]
research-required=Enable or disable requirement of special research to retain energy.
minimum-energy-retain-accumulator=Minimum charge required in an accumulator to retain energy. Range: 0–100. 100 = fully charged, 10 = above 10%, 50 = above 50%, 0 = never.
energy-stack-jumps=Rounding for easy stacking. Range: 0–100. Examples: 0 = no rounding, 10 = 10%, 20%, 30%, etc., 20 = 20%, 40%, 60%, etc. Rounding goes down, so with 10: 55% = 50%, 99% = 90%, 8% = 0%, etc.
accumulator-blacklist=Space-separated list of accumulator names to exclude from energy saving. Use debug info to find names. Split with spaces, for example: "accumulator accumulator-mk2".
accumulator-blacklist-as-whitelist=When enabled, the blacklist will act as a whitelist instead.
retain-on-player-mined=Enable to retain energy when a player picks up the accumulator.
retain-on-robot-mined=Enable to retain energy when a robot picks up the accumulator.
description-show-bar=Show a visual charge bar in the item description.
description-bar-filled-color=Color of the filled part of the charge bar. Example: "red", "#FF0000"
description-bar-empty-color=Color of the empty part of the charge bar. Example: "red", "#FF0000"
description-bar-decorator-color=Color of decorator (if present in description string) parts of the charge bar. Example: "red", "#FF0000"
description-string=String used to display charge bar. Examples: "<+>" = "<++++++++++>", "*" = "***********", "+=" = "+=+=+=+=+=+=", "[$%&]" = "[$%&$%&$%&$]"
description-bar-length=Cength of the charge bar's middle part. 1-100
description-show-percentage=Show numerical charge percentage in the item description.
description-percentage-color=Color of the charge percentage text. Example: "red", "#FF0000"
debug=Enables more logs and item info.

