[mod-setting-description]
research-required=Включить требование специального исследования для сохранения энергии.
minimum-energy-retain-accumulator=Минимальный заряд аккумулятора для сохранения энергии. Диапазон: 0–100. 100 = только при полном заряде, 10 = более 10%, 50 = более 50%, 0 = никогда.
energy-stack-jumps=Округление для удобного стакания. Диапазон: 0–100. Примеры: 0 = без округления, 10 = 10%, 20%, 30% и т.д., 20 = 20%, 40%, 60% и т.д. Округление идет в меньшую сторону, так что при 10: 55% = 50%, 99% = 90% 8% = 0% и т.д.
accumulator-blacklist=Список аккумуляторов, исключенных из сохранения энергии. Используйте отладочную информацию, чтобы узнать имена. Разделяйте пробелами, пример: "accumulator accumulator-mk2".
accumulator-blacklist-as-whitelist=Если включено, черный список аккумуляторов будет работать как белый.
retain-on-player-mined=Включить сохранение энергии при подъеме аккумулятора игроком.
retain-on-robot-mined=Включить сохранение энергии при подъеме аккумулятора роботом.
description-show-bar=Показывать шкалу заряда в описании предмета.
description-bar-filled-color=Цвет заполненной части шкалы заряда. Пример: "red", "#FF0000"
description-bar-empty-color=Цвет пустой части шкалы заряда. Пример: "red", "#FF0000"
description-bar-decorator-color=Цвет декоратора (если присутствует в строке шкалы заряда) у шкалы заряда. Пример: "red", "#FF0000"
description-string=Строка для шкалы заряда. Примеры: "<+>" = "<++++++++++>", "*" = "***********", "+=" = "+=+=+=+=+=+=", "[$%&]" = "[$%&$%&$%&$]"
description-bar-length=Длина средней части шкалы заряда. Диапазон: 1-100
description-show-percentage=Показывать процент заряда в описании предмета.
description-percentage-color=Цвет текста процента заряда. Пример: "red", "#FF0000"
debug=Включить больше логов и информацию о предмете.

[technology-name]
advanced_power_conservation=Продвинутое удержание энергии

[shortcut-name]
SaveMyPower_enable=Переключить сохранение энергии

[shortcut-description]
SaveMyPower_enable=Включить или отключить автоматическое сохранение энергии при добыче аккумуляторов.