[mod-setting-description]
default-blacklist-description=Лучше не трогать вообще. Используется для особых случаев, где сохранение энергии было бы дизбалансно, сломанно или попросу ненужно. Добавляется авторами модов или по репортам пользователей.
entity-blacklist-description=Список построек, исключённых из сохранения энергии. Разделяйте имена пробелами, например: "accumulator accumulator-mk2". Используйте дебаг (в самом низу), чтобы узнать имя в описании предмета.
entity-blacklist-as-whitelist-description=Если включено, чёрный список построек будет работать как белый.
equipment-blacklist-description=Список экипировки, исключённой из сохранения энергии. Разделяйте имена пробелами, например: "personal-battery personal-energy-shield". Используйте дебаг (в самом низу), чтобы узнать имя в описании предмета.
equipment-blacklist-as-whitelist-description=Если включено, чёрный список экипировки будет работать как белый.
minimum-energy-to-retain-description=Минимальный заряд объекта или экипировки в процентах для сохранения энергии. Диапазон: 0–100.
energy-stacking-description=Округление для удобного стакания. Диапазон: 0–100. Примеры: 0 = без округления, 10 = 10%, 20%, 30% и т.д., 20 = 20%, 40%, 60% и тд. Округление идёт в меньшую сторону, поэтому при 10: 55% = 50%, 99% = 90%, 8% = 0% и тд.
description-show-bar-description=Включает визуальную шкалу заряда в описании предмета.
description-bar-filled-color-description=Цвет заполненной части шкалы заряда.
description-bar-empty-color-description=Цвет пустой части шкалы заряда.
description-bar-decorator-color-description=Цвет декоратора шкалы заряда.
description-bar-length-description=Длина средней части шкалы заряда. Диапазон: 1–100.
description-show-percentage-description=Включает процент заряда в описании предмета.
description-percentage-color-description=Цвет текста процента заряда.
description-string-description=Строка для отображения шкалы заряда. Примеры: "<+>" = "<++++++++++>", "*" = "***********", "+=" = "+=+=+=+=+=+=", "[$%&]" = "[$%&$%&$%&$]"
research-required-description=Включает технологию «Продвинутое удержание энергии», которую необходимо исследовать для сохранения энергии.
retain-on-player-mined-description=Возможность сохранять энергию при добыче объекта игроком или платформой.
retain-on-robot-mined-description=Возможность сохранять энергию при добыче объекта дроном.
retain-equipment-energy-description=Возможность сохранять энергию при снятии оборудования игроком.
debug-description=Больше логов и информация о предмете в его описании.

